<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RL Training Dashboard - {{ env_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>🤖 RL Training Dashboard</h1>
            <div class="env-info">
                <span class="badge">{{ agent_class }}</span>
                <span class="badge">{{ env_name }}</span>
            </div>
        </header>

        <!-- Control Panel -->
        <div class="panel control-panel">
            <h2>⚙️ Control Panel</h2>
            <div class="controls">
                <button id="pauseBtn" class="btn btn-warning">⏸️ Pause</button>
                <button id="evaluateBtn" class="btn btn-primary">🎯 Evaluate</button>
                <button id="saveBtn" class="btn btn-success">💾 Save Model</button>
                <button id="toggleAxisBtn" class="btn btn-primary">🕐 Show Steps</button>
            </div>
            
            <div class="param-controls">
                <div class="param-control">
                    <label for="lrInput">Learning Rate:</label>
                    <input type="number" id="lrInput" step="0.0001" min="0">
                    <button class="btn btn-sm" onclick="setLearningRate()">Set</button>
                </div>
                <div class="param-control">
                    <label for="epsInput">Epsilon:</label>
                    <input type="number" id="epsInput" step="0.01" min="0" max="1">
                    <button class="btn btn-sm" onclick="setEpsilon()">Set</button>
                </div>
            </div>
        </div>

        <!-- Stats Panel -->
        <div class="panel stats-panel">
            <h2>📊 Statistics</h2>
            <div id="statsGrid" class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Environment Steps</div>
                    <div class="stat-value" id="stat-steps">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Episodes</div>
                    <div class="stat-value" id="stat-episodes">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Learning Rate</div>
                    <div class="stat-value" id="stat-lr">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Epsilon</div>
                    <div class="stat-value" id="stat-epsilon">-</div>
                </div>
            </div>
        </div>

        <!-- Metric Selection -->
        <div class="panel metric-panel">
            <h2>📈 Metrics</h2>
            <input type="text" id="metricSearch" placeholder="🔍 Search metrics..." class="search-input">
            <div id="metricList" class="metric-list"></div>
        </div>

        <!-- Main Plot -->
        <div class="panel plot-panel">
            <div id="mainPlot"></div>
        </div>

        <!-- Log Output -->
        <div class="panel log-panel">
            <h2>📝 Activity Log</h2>
            <div id="logOutput" class="log-output"></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='dashboard.js') }}"></script>
</body>
</html>
